name: Publish to GitHub Pages

on:
  push:
    branches:
      - one
  workflow_dispatch:

jobs:
  publish:
    name: Creating ubuntu-latest VM, install software and create web-page
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v1

      - name: Install Emacs
        run: sudo apt install emacs-nox --yes

      - name: Build the site
        run: ./build.sh

      - name: Publish content to Github pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: public
